<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CBR Builder · ProCredit Financing Corp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f8fa;
        --surface: #ffffff;
        --ink: #0e1726;
        --ink-2: #2d3748;
        --muted: #6b7785;
        --line: #e6eaef;
        --line-2: #cdd5de;
        /* ProCredit brand */
        --brand-blue: #2a75a8;
        --brand-blue-deep: #1f5a83;
        --brand-blue-soft: #e8f1f8;
        --brand-green: #4ea246;
        --brand-green-deep: #3d8a36;
        --brand-green-soft: #ebf5e9;
        --accent: var(--brand-blue);
        --accent-soft: var(--brand-blue-soft);
        --green: var(--brand-green-deep);
        --green-soft: var(--brand-green-soft);
        --red: oklch(54% 0.18 25);
        --red-soft: oklch(96% 0.04 25);
        --amber: oklch(64% 0.14 60);
        --amber-soft: oklch(96% 0.05 75);
        --slate: #54616e;
        --slate-soft: #eef1f5;
        --radius: 10px;
        --shadow-sm: 0 1px 0 rgba(15, 23, 38, 0.04), 0 1px 2px rgba(15, 23, 38, 0.04);
        --shadow-md: 0 1px 0 rgba(15, 23, 38, 0.04), 0 10px 28px -12px rgba(15, 23, 38, 0.14);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Source Sans 3", system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .serif { font-family: "Source Serif 4", "Times New Roman", serif; font-weight: 400; }

      /* Brand accents */
      .brand-stripe {
        height: 3px;
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-blue) 48%, var(--brand-green) 52%, var(--brand-green) 100%);
        border-radius: 3px 3px 0 0;
      }
      .brand-rule {
        height: 2px;
        width: 56px;
        background: linear-gradient(90deg, var(--brand-blue), var(--brand-green));
        border-radius: 2px;
      }

      /* Top bar */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(247, 248, 250, 0.85);
        backdrop-filter: saturate(140%) blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 28px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-logo {
        height: 32px;
        width: auto;
        display: block;
      }
      .brand-sub {
        color: var(--muted);
        font-weight: 500;
        font-size: 12.5px;
        letter-spacing: 0.01em;
        padding-left: 14px;
        border-left: 1px solid var(--line);
      }
      .spacer { flex: 1; }
      .pill {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--muted);
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
      }

      /* Layout */
      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 28px 96px;
      }

      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-blue);
      }
      h1 {
        font-family: "Source Serif 4", serif;
        font-weight: 500;
        font-size: 42px;
        letter-spacing: -0.015em;
        line-height: 1.08;
        margin: 10px 0 14px;
        color: var(--ink);
      }
      .lede {
        color: var(--ink-2);
        max-width: 640px;
        font-size: 15px;
      }

      /* Cards */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
      }
      .card-pad { padding: 20px 22px; }
      .card-head {
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .card-title {
        font-weight: 600;
        font-size: 13px;
        letter-spacing: -0.005em;
      }
      .card-title .num {
        font-family: "IBM Plex Mono", monospace;
        color: var(--brand-blue);
        font-weight: 600;
        margin-right: 8px;
      }

      /* Inputs */
      label.field {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input[type="text"], input[type="date"], textarea, select {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        outline: none;
        transition: border-color 120ms, box-shadow 120ms;
      }
      input:focus, textarea:focus, select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(42, 117, 168, 0.18);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 500 13px/1 "Source Sans 3", sans-serif;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid var(--brand-blue);
        background: var(--brand-blue);
        color: #fff;
        cursor: pointer;
        transition: transform 80ms ease, opacity 120ms, background 120ms;
      }
      .btn:hover { transform: translateY(-1px); background: var(--brand-blue-deep); border-color: var(--brand-blue-deep); }
      .btn:active { transform: translateY(0); }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border-color: var(--line-2);
      }
      .btn.ghost:hover { background: var(--surface); }
      .btn.subtle {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--line-2);
      }

      /* Dropzone */
      .drop-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .drop {
        position: relative;
        background: var(--surface);
        border: 1px dashed var(--line-2);
        border-radius: var(--radius);
        padding: 18px;
        min-height: 130px;
        transition: border-color 120ms, background 120ms;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
      .drop.has-file {
        border-style: solid;
        border-color: var(--accent);
        background: var(--surface);
      }
      .drop.drag { border-color: var(--accent); background: var(--accent-soft); }
      .drop-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .drop-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .drop-tag .dot {
        width: 6px; height: 6px; border-radius: 999px;
        background: var(--line-2);
        transition: background 120ms;
      }
      .drop:hover .drop-tag .dot { background: var(--brand-blue); }
      .drop.has-file .drop-tag .dot { background: var(--brand-green-deep); }
      .drop-name {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.005em;
      }
      .drop-desc {
        color: var(--muted);
        font-size: 12.5px;
      }
      .drop-file {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
      }
      .drop-filename {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 70%;
      }
      .x-btn {
        background: transparent;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        padding: 4px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
      }
      .x-btn:hover { color: var(--red); }

      /* Status badges */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 4px;
        background: var(--slate-soft);
        color: var(--slate);
        white-space: nowrap;
      }
      .badge.green { background: var(--green-soft); color: var(--green); }
      .badge.red { background: var(--red-soft); color: var(--red); }
      .badge.amber { background: var(--amber-soft); color: var(--amber); }
      .badge.accent { background: var(--accent-soft); color: var(--accent); }

      /* Tables */
      table.data {
        width: 100%;
        border-collapse: collapse;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
      }
      table.data th {
        text-align: left;
        font-weight: 500;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      table.data td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        vertical-align: top;
      }
      table.data tr:last-child td { border-bottom: 0; }
      table.data tr.subject-row td {
        background: #f4f8fb;
        font-weight: 600;
        font-family: "Source Sans 3", sans-serif;
        font-size: 13px;
        border-left: 3px solid var(--brand-blue);
      }
      table.data tr.subject-row td .badge { margin-left: 8px; }

      .num-cell { text-align: right; font-variant-numeric: tabular-nums; }

      /* Sections */
      .section { margin-top: 32px; }
      .section-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
      }
      .section-head::before {
        content: "";
        width: 4px;
        height: 22px;
        border-radius: 2px;
        background: linear-gradient(180deg, var(--brand-blue), var(--brand-green));
      }
      .section-num {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--brand-blue);
        text-transform: uppercase;
        font-weight: 600;
      }
      .section-title {
        font-family: "Source Serif 4", serif;
        font-weight: 500;
        font-size: 26px;
        letter-spacing: -0.01em;
        margin: 0;
        color: var(--ink);
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .meta-cell {
        background: var(--surface);
        padding: 14px 16px;
      }
      .meta-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .meta-val {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.005em;
      }

      /* Risk hero */
      .risk-hero {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 0;
        overflow: hidden;
        position: relative;
      }
      .risk-hero::after {
        content: "";
        position: absolute;
        left: 0; right: 0; top: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-blue) 48%, var(--brand-green) 52%, var(--brand-green) 100%);
      }
      .risk-block {
        background: linear-gradient(155deg, #0e1726 0%, #1f3349 100%);
        color: #fff;
        padding: 26px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .risk-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.55);
      }
      .risk-score {
        font-family: "Source Serif 4", serif;
        font-size: 72px;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, oklch(78% 0.13 230), oklch(82% 0.16 145));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .risk-score .denom {
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
        color: rgba(255,255,255,0.5);
        margin-left: 4px;
      }
      .risk-tier {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: oklch(85% 0.13 70);
      }
      .risk-text { padding: 26px; }

      /* 3-col layout for findings/actions */
      .tri {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .tri > div {
        background: var(--surface);
        padding: 20px 22px;
      }
      .tri h4 {
        margin: 0 0 10px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
      }
      .tri ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .tri li {
        padding: 8px 0;
        border-bottom: 1px dashed var(--line);
        font-size: 13px;
        color: var(--ink-2);
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .tri li:last-child { border-bottom: 0; }
      .tri li::before {
        content: "";
        flex-shrink: 0;
        width: 4px; height: 4px;
        border-radius: 999px;
        background: var(--ink);
        margin-top: 8px;
      }

      /* Two col */
      .two-col {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 22px;
      }

      /* Processing */
      .process {
        max-width: 520px;
        margin: 80px auto;
        text-align: center;
      }
      .process-title {
        font-family: "Source Serif 4", serif;
        font-weight: 500;
        font-size: 32px;
        letter-spacing: -0.01em;
        margin: 8px 0 24px;
        color: var(--ink);
      }
      .step {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        margin-bottom: 8px;
        text-align: left;
      }
      .step-mark {
        width: 22px; height: 22px;
        border-radius: 999px;
        border: 1px solid var(--line-2);
        display: grid; place-items: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .step.done .step-mark {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .step.active .step-mark {
        background: var(--brand-blue);
        border-color: var(--brand-blue);
        color: #fff;
        animation: pulse 1.4s infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(42, 117, 168, 0.5); }
        50% { box-shadow: 0 0 0 8px rgba(42, 117, 168, 0); }
      }
      .step-text { flex: 1; font-size: 14px; }
      .step-meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--muted);
      }

      /* Right rail */
      .summary-rail {
        position: sticky;
        top: 78px;
        align-self: start;
      }
      .stat {
        padding: 14px 0;
        border-bottom: 1px dashed var(--line);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .stat:last-child { border-bottom: 0; }
      .stat-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .stat-val { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }

      /* Footer of report */
      .signoff {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        margin-top: 22px;
      }
      .signoff > div {
        background: var(--surface);
        padding: 18px 20px;
      }
      .signoff .role {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .signoff .who { font-weight: 600; font-size: 14px; }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin: 0 0 22px;
      }
      .tab {
        background: transparent;
        border: 0;
        padding: 10px 14px;
        font: 500 13px/1 "Source Sans 3", sans-serif;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tab.active { color: var(--brand-blue); border-bottom-color: var(--brand-blue); }
      .tab:hover { color: var(--ink); }

      /* Card top accent stripe */
      .card.accent { position: relative; overflow: hidden; }
      .card.accent::before {
        content: "";
        position: absolute;
        left: 0; right: 0; top: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-blue) 48%, var(--brand-green) 52%, var(--brand-green) 100%);
      }

      /* Brand-tinted stat numbers */
      .stat-val.pos { color: var(--brand-green-deep); }
      .stat-val.brand { color: var(--brand-blue); }

      /* Green secondary button */
      .btn.green {
        background: var(--brand-green-deep);
        border-color: var(--brand-green-deep);
      }
      .btn.green:hover { background: var(--brand-green); border-color: var(--brand-green); }

      /* Brand-tinted demo CTA */
      .btn.ghost.brand {
        border-color: var(--brand-blue);
        color: var(--brand-blue);
      }
      .btn.ghost.brand:hover { background: var(--brand-blue-soft); }

      /* Tag pill on hero */
      .meta-cell.pos { background: var(--brand-green-soft); }
      .meta-cell.cool { background: var(--brand-blue-soft); }

      /* Buffer / welcome page */
      .buffer {
        min-height: calc(100vh - 60px);
        display: grid;
        place-items: center;
        padding: 40px 28px;
        position: relative;
        overflow: hidden;
      }
      .buffer::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(800px 400px at 12% 18%, rgba(42, 117, 168, 0.10), transparent 60%),
          radial-gradient(700px 380px at 88% 82%, rgba(78, 162, 70, 0.10), transparent 60%);
        pointer-events: none;
      }
      .buffer-inner {
        position: relative;
        max-width: 880px;
        width: 100%;
        text-align: center;
      }
      .buffer-logo {
        height: 64px;
        width: auto;
        margin: 0 auto 28px;
        display: block;
      }
      .buffer-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--brand-blue);
        padding: 6px 12px;
        border: 1px solid var(--brand-blue-soft);
        background: rgba(255,255,255,0.7);
        border-radius: 999px;
        margin-bottom: 18px;
      }
      .buffer-eyebrow .ping {
        width: 7px; height: 7px; border-radius: 999px;
        background: var(--brand-green-deep);
        box-shadow: 0 0 0 0 rgba(78, 162, 70, 0.6);
        animation: ping 1.6s infinite;
      }
      @keyframes ping {
        0%   { box-shadow: 0 0 0 0 rgba(78, 162, 70, 0.5); }
        70%  { box-shadow: 0 0 0 8px rgba(78, 162, 70, 0); }
        100% { box-shadow: 0 0 0 0 rgba(78, 162, 70, 0); }
      }
      .buffer-title {
        font-family: "Source Serif 4", serif;
        font-weight: 500;
        font-size: 52px;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 0 0 16px;
        color: var(--ink);
      }
      .buffer-title em {
        font-style: normal;
        background: linear-gradient(135deg, var(--brand-blue), var(--brand-green-deep));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        white-space: nowrap;
      }
      .buffer-lede {
        font-size: 17px;
        color: var(--ink-2);
        max-width: 560px;
        margin: 0 auto 32px;
        line-height: 1.5;
      }
      .buffer-cta {
        display: inline-flex;
        gap: 12px;
        margin-bottom: 56px;
      }
      .buffer-btn {
        font: 500 14px/1 "Source Sans 3", sans-serif;
        padding: 14px 22px;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 80ms, background 120ms;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .buffer-btn.primary {
        background: var(--brand-blue);
        color: #fff;
        border-color: var(--brand-blue);
      }
      .buffer-btn.primary:hover { background: var(--brand-blue-deep); border-color: var(--brand-blue-deep); transform: translateY(-1px); }
      .buffer-btn.ghost {
        background: transparent;
        color: var(--brand-blue);
        border-color: var(--brand-blue-soft);
      }
      .buffer-btn.ghost:hover { background: var(--brand-blue-soft); }

      .buffer-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        text-align: left;
      }
      .buffer-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px 18px 20px;
        position: relative;
        overflow: hidden;
      }
      .buffer-card::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--brand-blue);
      }
      .buffer-card:nth-child(even)::before { background: var(--brand-green-deep); }
      .buffer-card .tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-blue);
        margin-bottom: 8px;
      }
      .buffer-card:nth-child(even) .tag { color: var(--brand-green-deep); }
      .buffer-card h3 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.005em;
      }
      .buffer-card p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.45;
      }

      .buffer-strip {
        margin-top: 56px;
        padding-top: 24px;
        border-top: 1px dashed var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .buffer-strip .mono { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }

      @media (max-width: 760px) {
        .buffer-title { font-size: 36px; }
        .buffer-grid { grid-template-columns: 1fr 1fr; }
      }

      /* helpers */
      .hstack { display: flex; align-items: center; gap: 10px; }
      .row-gap-22 > * + * { margin-top: 22px; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }
      hr.soft { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

      @media (max-width: 900px) {
        .drop-grid, .meta-grid, .tri, .two-col, .risk-hero, .signoff {
          grid-template-columns: 1fr;
        }
        .risk-block { padding: 22px; }
      }
    </style>
  </head>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
