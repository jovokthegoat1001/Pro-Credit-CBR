server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Python CIC extractor (PDF upload — longer timeout, larger body) ────────
    location /api/extract-cic {
        proxy_pass         http://${PYTHON_API_HOST}:3009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # ── Python text extractor ─────────────────────────────────────────────────
    location /api/extract-text {
        proxy_pass         http://${PYTHON_API_HOST}:3009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        client_max_body_size 50m;
        proxy_read_timeout   120s;
    }

    # ── Node Anthropic API proxy ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://${NODE_API_HOST}:3008;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── React SPA — serve index.html for all unmatched routes ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
