server {
    listen 80;
    server_name _;

    resolver 8.8.8.8 valid=30s;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Python CIC extractor (PDF upload — longer timeout, larger body) ────────
    location /api/extract-cic {
        set $python_host "${PYTHON_API_HOST}";
        proxy_pass         https://$python_host/api/extract-cic;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $python_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # ── Python text extractor ─────────────────────────────────────────────────
    location /api/extract-text {
        set $python_host "${PYTHON_API_HOST}";
        proxy_pass         https://$python_host/api/extract-text;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $python_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        client_max_body_size 50m;
        proxy_read_timeout   120s;
    }

    # ── Node Anthropic API proxy ───────────────────────────────────────────────
    location /api/ {
        set $node_host "${NODE_API_HOST}";
        proxy_pass         https://$node_host;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $node_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── React SPA — serve index.html for all unmatched routes ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
